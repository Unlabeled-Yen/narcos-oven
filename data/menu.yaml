  # ⚠️⚠️⚠️ 焙茶類命名混亂區 ⚠️⚠️⚠️
  # 菜單權威：純焙茶=$880、焙茶栗子=$980
  # 但兩份資料源的名字都跟菜單不一致：
  #   賣貨便掛「焙茶栗子巴斯克」大分類，實際賣 $880 純焙茶（括號註「不添加栗子」）
  #   面交 c17 簡稱「焙茶巴斯克」實際售 $980 = 焙茶栗子
  # 因此 lookup 演算法要「信價格不信名字」——alias 依實際售價綁定：

  焙茶巴斯克:              # 純焙茶（無栗子）= $880
    display_name: 焙茶巴斯克（純焙茶）
    category: single
    price: 880
    cost: null
    contains:
      - {atom: 焙茶巴斯克, count: 1}
    aliases:
      # 賣貨便字串：分類掛「焙茶栗子」但註記「純焙茶不添加栗子」+ 售 $880 = 這其實是純焙茶
      - 無麩 ✦ 焙茶栗子巴斯克 六寸 焙茶巴斯克（純焙茶，不添加栗子）
    match_signature:
      include: [純焙茶, 不添加栗子]     # 這是最穩的關鍵字組合
      exclude: [白玉]
    seen_count: 1            # 賣貨便本批 1 筆（雖名字掛焙茶栗子）
    notes: |
      ⚠️ 售價=$880 為判定 anchor。若日後看到「焙茶巴斯克」但售 $980，那是焙茶栗子。
      建議跟雇主 confirm 是否把賣貨便 SKU 命名整理清楚。

  焙茶栗子巴斯克:            # 有栗子 = $980
    display_name: 焙茶栗子巴斯克
    category: single
    price: 980
    cost: null
    contains:
      - {atom: 焙茶栗子巴斯克, count: 1}
    aliases:
      # 面交 c17 header：簡稱「焙茶巴斯克」但售 $980 = 這其實是焙茶栗子
      - 焙茶巴斯克 $980
    match_signature:
      include: [焙茶巴斯克]
      exclude: [純焙茶, 不添加栗子, 白玉]
    seen_count: 0            # 本批賣貨便無、面交 c17 有 1 筆
    notes: |
      ⚠️ 售價=$980 為判定 anchor。名字「焙茶巴斯克」是雇主面交表簡稱、非菜單全名。

