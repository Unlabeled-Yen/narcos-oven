# narcos-oven 官方菜單對照表 v1
# ================================================================
# 依據 2026-07-02 雇主 confirm 定案。以菜單圖片為權威（fixtures/2026-07-round1/菜單/）。
# 這是主軌 deterministic pipeline 的唯一 source of truth。
#
# 識別碼慣例：atoms + products id 全中文（短、無空白/標點）
#
# lookup 演算法（見 docs/spec.md §3 Stage 2）：
#   1. 先跟 aliases[] 做 exact 字串 match（100% 命中最快）
#   2. 若無命中，跟 match_signature 做「中文字 include/exclude」判定
#   3. display_name 純粹是 UI 顯示用
#
# Yen 手改此檔為主。analyzer 不覆蓋此檔、只在 data-analysis.md 提「建議修改」。
# ================================================================

